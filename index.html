<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castelo da Ana Bots</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="royal-bar">
    <div class="ornament"></div><span class="crown">♛</span><div class="ornament"></div>
  </header>

  <main class="hero">
    <div class="shade"></div>
    <div class="cursor-light" id="cursor-light" aria-hidden="true"></div>
    <section class="bot-showcase" aria-label="Bots">
      <button class="arrow" id="prev" aria-label="Bot anterior">‹</button>
      <div class="bot-content">
        <div class="profile-ring"><img id="bot-image" src="img/aninha-lofi.png" alt="Aninha"></div>
        <h1 id="bot-name">Aninha</h1>
        <div class="bot-type" id="bot-type">LoFi</div>
        <p id="bot-description"></p>
        <div class="features" id="features"></div>
        <button class="commands-btn" id="commands-btn">Ver comandos</button>
        <div class="dots" id="dots" aria-label="Selecionar bot"></div>
      </div>
      <button class="arrow" id="next" aria-label="Próximo bot">›</button>
    </section>
  </main>

  <div class="commands-modal" id="commands-modal" aria-hidden="true">
    <div class="commands-overlay" id="commands-overlay"></div>
    <section class="commands-panel" role="dialog" aria-modal="true" aria-labelledby="commands-title">
      <button class="commands-close" id="commands-close" aria-label="Fechar">×</button>
      <div class="commands-heading"><span>♬</span><h2 id="commands-title">Comandos</h2></div>
      <div id="commands-content"></div>
    </section>
  </div>

  <footer class="royal-bar bottom">
    <div class="ornament"></div><span class="crown">♛</span><div class="ornament"></div>
  </footer>

<script>
const bots = [
  {
    name: "Aninha", type: "LoFi", image: "img/aninha-lofi.png",
    description: "A Aninha é nosso bot de LoFi, criada para deixar seu servidor mais tranquilo e aconchegante. Ela entra na call, toca estações LoFi 24 horas e permite trocar entre diferentes estações.",
    features: [["♫","Música LoFi"],["🔊","LoFi 24 horas"],["🎚","Troca de estações"]],
    commands: {
      public: [{name:"/radio", type:"LoFi", description:"Troca a estação de LoFi que a Aninha está tocando na call.", extra:"Escolha uma das estações disponíveis:", stations:["🌙 Chilling","📚 Studying","💻 Working","😴 Sleeping","🎮 Gaming","🌸 Japanese Lofi"], note:"O comando pode ser usado no canal de comandos ou enquanto você estiver na call de LoFi."}],
      private: []
    }
  },
  {
    name: "Minju", type: "Comandos gerais", image: "img/minju.webp",
    description: "A Minju é o bot de comandos gerais do servidor. Ela reúne ferramentas para consultar informações, visualizar ícones e banners e também funções administrativas.",
    features: [["⚙","Comandos gerais"],["🏰","Informações do servidor"],["🛠","Ferramentas administrativas"]],
    commands: {
      public: [
        {name:"/icone_servidor", type:"Público", description:"Mostra o ícone atual do servidor."},
        {name:"/icone_usuario", type:"Público", description:"Mostra o avatar de um usuário. Se o usuário não for informado, mostra o seu próprio avatar."},
        {name:"/servidor info", type:"Público", description:"Mostra informações do servidor, como ID, dono, quantidade de canais, data de criação, quando você entrou e número de membros."},
        {name:"/banner servidor", type:"Público", description:"Mostra o banner atual do servidor, quando houver um configurado."},
        {name:"/banner usuario", type:"Público", description:"Mostra o banner de um usuário. Se o usuário não for informado, mostra o seu próprio banner."},
        {name:"/funcionamento", type:"Público", description:"Explica como funcionam os comandos da Minju e mostra a separação entre comandos públicos e privados."}
      ],
      private: [
        {name:"/emoji add", type:"Somente dona", description:"Adiciona um emoji personalizado ao servidor a partir de um emoji personalizado do Discord. É necessário ter permissão para gerenciar expressões."},
        {name:"/apagar_mensagem", type:"Somente dona", description:"Apaga mensagens do canal. Permite escolher de 1 a 1000 mensagens e, opcionalmente, limitar a limpeza às mensagens de um usuário específico."}
      ]
    }
  },
  {
    name: "Jorel", type: "Eleições", image: "img/jorel-eleicoes.png",
    background: "img/fundo-brasil-2026.webp",
    cursorLight: "gold",
    description: "O Jorel é o bot de eleições do servidor. Ele acompanha automaticamente a apuração para Presidente em 2026 e mantém as informações do canal de eleições atualizadas sozinho.",
    features: [["🗳", "Eleições"],["🇧🇷", "Brasil"],["🔄", "Atualização automática"]],
    commands: {
      public: [],
      private: [
        {name:"/apuracao", type:"Somente dona", description:"Força uma atualização imediata da apuração para Presidente."},
        {name:"/atualizar", type:"Somente dona", description:"Força manualmente a atualização da apuração."}
      ],
      automatic: "O Jorel consulta os dados automaticamente a cada 3 segundos e só edita a mensagem do canal quando os dados mudam."
    }
  }
];

let current=0;
const image=document.getElementById('bot-image'), name=document.getElementById('bot-name'), type=document.getElementById('bot-type'), description=document.getElementById('bot-description'), features=document.getElementById('features'), dots=document.getElementById('dots');
const commandsBtn=document.getElementById('commands-btn'), modal=document.getElementById('commands-modal'), close=document.getElementById('commands-close'), overlay=document.getElementById('commands-overlay'), content=document.getElementById('commands-content'), title=document.getElementById('commands-title');

function renderFeatures(bot){features.innerHTML=''; bot.features.forEach(f=>{features.innerHTML+=`<div class="feature"><span>${f[0]}</span><small>${f[1]}</small></div>`});}
function commandCard(c){let html=`<div class="command-card"><div class="command-top"><code>${c.name}</code><span>${c.type}</span></div><p>${c.description}</p>`; if(c.extra) html+=`<p class="command-note">${c.extra}</p><div class="station-list">${c.stations.map(s=>`<span>${s}</span>`).join('')}</div>`; if(c.note) html+=`<p class="command-note">${c.note}</p>`; return html+'</div>';}
function renderCommands(){const bot=bots[current]; title.textContent=`Comandos da ${bot.name}`; let html=''; if(bot.commands.public.length){html+=`<h3 class="command-section-title">🟢 Comandos públicos</h3>`+bot.commands.public.map(commandCard).join('');} if(bot.commands.private.length){html+=`<h3 class="command-section-title">🔒 Comandos privados</h3>`+bot.commands.private.map(commandCard).join('');} if(bot.commands.automatic){html+=`<h3 class="command-section-title">🔄 Automático</h3><div class="command-card automatic-card"><p>${bot.commands.automatic}</p></div>`;} if(bot.name==='Minju') html+=`<p class="commands-footnote">Os comandos públicos da Minju só podem ser usados no canal configurado como #comandos. Os comandos privados do código atual são exclusivos da dona do bot.</p>`; if(bot.name==='Jorel') html+=`<p class="commands-footnote">O Jorel fica no canal de eleições configurado para ele e faz a atualização automaticamente. Não é necessário usar um comando para manter a apuração atualizada.</p>`; content.innerHTML=html;}
function openCommands(){renderCommands(); modal.classList.add('open'); modal.setAttribute('aria-hidden','false');}
function closeCommands(){modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');}
commandsBtn.addEventListener('click',openCommands); close.addEventListener('click',closeCommands); overlay.addEventListener('click',closeCommands); document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCommands();});
function renderDots(){dots.innerHTML=''; bots.forEach((b,i)=>{const d=document.createElement('button'); d.className='dot'+(i===current?' active':''); d.setAttribute('aria-label',`Selecionar ${b.name}`); d.addEventListener('click',()=>{current=i;render();}); dots.appendChild(d);});}
function render(){const b=bots[current]; image.src=b.image; image.alt=b.name; name.textContent=b.name; type.textContent=b.type; description.textContent=b.description; const hero=document.querySelector('.hero'); hero.style.backgroundImage=`url("${b.background || 'img/fundo-castelo.png'}")`; hero.classList.toggle('jorel-active', b.cursorLight === 'gold'); hero.classList.toggle('pink-active', b.cursorLight === 'pink'); renderFeatures(b); renderDots();}
document.getElementById('prev').addEventListener('click',()=>{current=(current-1+bots.length)%bots.length;render();});
document.getElementById('next').addEventListener('click',()=>{current=(current+1)%bots.length;render();});
const cursorLight=document.getElementById('cursor-light');
const hero=document.querySelector('.hero');
hero.addEventListener('mousemove',e=>{
  if(!hero.classList.contains('jorel-active')) return;
  const r=hero.getBoundingClientRect();
  cursorLight.style.left=(e.clientX-r.left)+'px';
  cursorLight.style.top=(e.clientY-r.top)+'px';
});
render();
</script>
</body></html>
